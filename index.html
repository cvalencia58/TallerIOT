<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Centro de Monitoreo IoT - Bucaramanga</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Tema visual moderno (Vue) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Cargando Centro de Monitoreo...</div>
  <script>
    window.$docsify = {
      name: 'Flota Maquinaria Pesada',
      repo: '',
      loadSidebar: false,
      auto2top: true,
      homepage: 'README.md' // Aquí le decimos que lea tu documento
    }
  </script>
  <!-- Motor de Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Soporte para renderizar los diagramas Mermaid -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.$docsify.markdown = {
      renderer: {
        code: function(code, lang) {
          if (lang === "mermaid") {
            return (
              '<div class="mermaid">' + mermaid.render('mermaid-svg-' + Math.random().toString(36).substring(2), code) + '</div>'
            );
          }
          return this.origin.code.apply(this, arguments);
        }
      }
    };
  </script>
</body>
</html>
